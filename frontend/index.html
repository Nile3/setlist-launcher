<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set List Controller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Set List Controller</h1>
        
        <div>
            <input type="text" id="setListName" placeholder="Enter set list name">
            <button onclick="saveSetList()">Save Set List</button>
        </div>
        
        <div>
            <select id="setListDropdown"></select>
            <button onclick="loadSetList()">Load Set List</button>
        </div>
        
        <div>
            <h3>Available Songs</h3>
            <ul id="songList"></ul>
        </div>
        
        <h3>Set List</h3>
        <ul id="setList"></ul>
        
        <button onclick="stopScript()" class="stop-button">Stop</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
