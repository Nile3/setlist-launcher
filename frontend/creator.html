<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set List Creator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Set List Creator</h1>

        <div>
            <input type="text" id="setListName" placeholder="Enter set list name">
            <button onclick="saveSetList()">Save Set List</button>
        </div>

        <h3>Available Songs</h3>
        <ul id="songList"></ul>

        <button onclick="window.location.href='/player'">Go to Player</button>
    </div>

    <script src="creator.js"></script>
</body>
</html>
